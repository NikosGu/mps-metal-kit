[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mps-metal-kit"
version = "0.2.0"
description = "Zero-copy C++20 / Objective-C++ / Metal / Accelerate and parallel CUDA / FP64 kernel toolkit for PyTorch MPS and CUDA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "NikosGu" }
]
keywords = [
    "pytorch",
    "mps",
    "metal",
    "apple-silicon",
    "accelerate",
    "amx",
    "linear-attention",
    "deltanet",
    "custom-kernels",
    "cpp20",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C++",
    "Programming Language :: Objective C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Repository = "https://github.com/NikosGu/mps-metal-kit"
Issues = "https://github.com/NikosGu/mps-metal-kit/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mps_metal_kit = [
    "csrc/*.mm",
    "shaders/*.metal",
    "include/mps_metal_kit/*.hpp",
    "cuda_csrc/*.hpp",
    "cuda_csrc/*.cpp",
    "cuda_csrc/*.cu",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
